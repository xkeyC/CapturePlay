[package]
name = "nr-bridge"
description = "Forwarding host for community nvngx_dlssnr.dll builds (CapturePlay experimental)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "captureplay_nvngx"
crate-type = ["cdylib"]

# Windows-only: the community runtime is a Windows DLL.
[target.'cfg(windows)'.dependencies]
windows = { workspace = true }
